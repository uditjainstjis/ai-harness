[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana"
version = "0.2.0"
description = "Pramana: an autonomous coding-agent harness whose patches carry their own proof."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "rich>=13.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pramana = "pramana.cli:main"

[tool.setuptools.packages.find]
include = ["pramana*"]

[tool.setuptools.package-data]
pramana = ["web/static/*", "web/static/office/*", "web/static/office/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
